version: '3.8'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql

  api:
    build: .
    depends_on:
      - sqlserver
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ATMChallengeDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;
      - Jwt__Key=ThisIsASecretKeyForJWT1234567890
      - Jwt__Issuer=ATMChallengeIssuer
      - Jwt__Audience=ATMChallengeAudience
    ports:
      - "5000:80"

volumes:
  sqlserverdata:
