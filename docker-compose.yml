version: '3.8'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_password123' -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ATMChallengeDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;
      - Jwt__Key=ThisIsASecretKeyForJWT1234567890
      - Jwt__Issuer=ATMChallengeIssuer
      - Jwt__Audience=ATMChallengeAudience
      - ASPNETCORE_HTTP_PORTS=80
    ports:
      - "5000:80"

volumes:
  sqlserverdata:
